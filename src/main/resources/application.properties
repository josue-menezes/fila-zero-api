spring.application.name=fila-zero-api

# Porta: o Render informa a porta pela variável PORT; localmente usa 8080
server.port=${PORT:8080}

# Banco Oracle da FIAP: valores lidos SÓ de variáveis de ambiente (nunca no código)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno: o Oracle da FIAP limita conexões por aluno
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Erros nunca expõem stack trace nem detalhes internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Datas no JSON no formato ISO 8601 (ex.: 2026-11-20T14:00:00)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
